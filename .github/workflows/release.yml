name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # fail before building if this tag has no release notes
  check-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes exist
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$f" ]; then
            echo "::error file=$f::Missing release notes: add $f before tagging ${GITHUB_REF_NAME}"
            exit 1
          fi

  build-linux:
    needs: check-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: dist/*.AppImage
          if-no-files-found: error

  build-windows:
    needs: check-notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: dist/*.exe
          if-no-files-found: error

  # publish once, only after every build passes, so a release never goes out half-built or without notes
  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.exe
