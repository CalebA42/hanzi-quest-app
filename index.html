<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字冒险 · Hanzi Quest</title>
<style>
/* ============================================================
   HANZI QUEST — design tokens
   ink cave-dark, amber torchlight, jade for "go", lantern red
   for danger. CJK face carries the content; monospace carries
   the UI chrome, like a cartridge-era menu.
   ============================================================ */
:root{
  --ink:#141021;          /* page night */
  --panel:#221b36;        /* dialogue panels */
  --panel-2:#2b2344;      /* raised panels */
  --stone:#4a3f6b;        /* borders */
  --paper:#f2e9d8;        /* main text */
  --dim:#9a8fb8;          /* secondary text */
  --amber:#ffb347;        /* torchlight / pinyin */
  --jade:#8ce08a;         /* positive / choices */
  --blood:#e0566b;        /* damage / hearts */
  --lantern:#d94f4f;      /* accents, title */
  --cjk:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  --ui:"DejaVu Sans Mono","Menlo","Consolas","Courier New",monospace;
  --tip-py-size:16px;
  --tip-en-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #241b3e 0%, var(--ink) 60%);
  color:var(--paper);
  font-family:var(--cjk);
  display:flex;justify-content:center;
  padding:18px 10px 40px;
}
#frame{
  width:100%;max-width:720px;
}
/* ---- cartridge frame around the whole game ---- */
#cart{
  border:3px solid var(--stone);
  background:var(--panel);
  box-shadow:0 0 0 3px var(--ink), 0 0 0 6px #332a52, 0 14px 40px rgba(0,0,0,.6);
  border-radius:6px;overflow:hidden;
}
/* ---- top status bar ---- */
#hud{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:var(--panel-2);
  border-bottom:3px solid var(--stone);
  font-family:var(--ui);font-size:12px;letter-spacing:1px;
}
#hud .tag{color:var(--dim);text-transform:uppercase}
#hearts{color:var(--blood);font-size:14px;letter-spacing:2px}
#hud .grow{flex:1}
#hudinv:empty,.hudbreak{display:none}
/* labels never wrap mid-word; only the item list may */
#hud{flex-wrap:wrap;row-gap:6px}
#hud .tag,.hudbtn{white-space:nowrap}
/* collected items: one chip each, hover/tap for pinyin + meaning */
#hudinv{display:flex;flex-wrap:wrap;gap:4px}
#hudinv .item{
  font-family:var(--cjk);font-size:16px;line-height:1.3;color:var(--paper);
  background:var(--panel);border:2px solid var(--stone);border-radius:4px;
  padding:1px 6px;cursor:help;white-space:nowrap;
}
#hudinv .item:hover{border-color:var(--amber)}
/* once items are collected they get their own row, so row 1 never squeezes */
#hud.hasitems .hudbreak{display:block;flex-basis:100%;order:1}
#hud.hasitems #hudinv{order:2;flex:1}
.hudbtn{
  font-family:var(--ui);font-size:11px;letter-spacing:1px;
  background:var(--panel);color:var(--paper);
  border:2px solid var(--stone);border-radius:4px;
  padding:4px 10px;cursor:pointer;box-shadow:0 2px 0 #171226;
}
.hudbtn:hover{border-color:var(--amber);color:var(--amber)}
.hudbtn:active{transform:translateY(2px);box-shadow:none}
/* ---- pixel viewport ---- */
#viewwrap{background:#0d0a17;border-bottom:3px solid var(--stone);position:relative}
#view{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#lvlbadge{
  position:absolute;top:8px;left:8px;
  font-family:var(--ui);font-size:11px;letter-spacing:1px;
  background:rgba(20,16,33,.8);border:2px solid var(--stone);
  color:var(--amber);padding:3px 8px;border-radius:4px;
}
/* ---- dialogue area ---- */
#stage{padding:14px 14px 18px;min-height:230px}
.bubble{
  position:relative;
  background:var(--ink);
  border:2px solid var(--stone);
  border-radius:8px;
  padding:12px 78px 12px 14px;
  margin:0 0 10px;
  font-size:23px;line-height:2.05;
  animation:pop .18s ease-out;
}
.bubble.sys{font-family:var(--ui);font-size:12px;color:var(--dim);
  padding:8px 12px;line-height:1.6;border-style:dashed}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* per-bubble helper buttons */
.helpers{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.mini{
  font-family:var(--ui);font-size:10px;line-height:1;
  background:var(--panel-2);color:var(--dim);
  border:2px solid var(--stone);border-radius:4px;
  padding:4px 6px;cursor:pointer;
}
.mini:hover{color:var(--amber);border-color:var(--amber)}
.mini.on{color:var(--ink);background:var(--amber);border-color:var(--amber)}
/* ---- interactive words ---- */
.w{cursor:help;border-bottom:1px dotted rgba(154,143,184,.55);transition:background .12s}
.w:hover{background:rgba(255,179,71,.18);border-bottom-color:var(--amber)}
.punct{color:var(--dim)}
ruby rt{
  font-size:11px;color:var(--amber);opacity:0;letter-spacing:0;
  transition:opacity .15s;font-family:var(--ui);
}
.show-py ruby rt{opacity:1}
/* speaker name chip */
.chip{
  display:inline-block;font-family:var(--ui);font-size:11px;letter-spacing:1px;
  color:var(--amber);border:1px solid var(--stone);border-radius:3px;
  padding:1px 6px;margin-right:8px;vertical-align:middle;background:var(--panel-2);
}
/* ---- choices ---- */
#choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{
  text-align:left;font-family:var(--cjk);font-size:21px;line-height:1.9;
  background:var(--panel-2);color:var(--paper);
  border:2px solid var(--stone);border-radius:8px;
  padding:9px 14px 9px 40px;cursor:pointer;position:relative;
  box-shadow:0 3px 0 #171226;
}
.choice::before{
  content:"▶";position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--jade);font-size:12px;
}
.choice:hover{border-color:var(--jade);background:#2f2850}
.choice:active{transform:translateY(3px);box-shadow:none}
.choice.danger::before{color:var(--blood)}
.choice.danger:hover{border-color:var(--blood)}
/* ---- tooltip ---- */
#tip{
  position:fixed;z-index:50;pointer-events:none;display:none;
  background:#0d0a17;border:2px solid var(--amber);border-radius:6px;
  padding:8px 12px;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.6);
}
#tip .th{font-size:20px}
#tip .tp{font-family:var(--ui);font-size:var(--tip-py-size);color:var(--amber);margin:2px 0;line-height:1.4}
#tip .te{font-family:var(--ui);font-size:var(--tip-en-size);color:var(--dim)}
.tipsize-group{display:flex;gap:2px}
.tipsize-group .hudbtn{padding:4px 7px}
.tipsize-group .hudbtn.on{color:var(--amber);border-color:var(--amber)}
/* ---- about modal ---- */
#about-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;
}
#about-backdrop.open{display:flex}
#about-panel{
  background:var(--panel-2);border:2px solid var(--stone);border-radius:8px;
  padding:20px 24px;max-width:320px;width:90%;
  font-family:var(--ui);color:var(--paper);
  box-shadow:0 12px 40px rgba(0,0,0,.6);
}
#about-panel .about-title{font-family:var(--cjk);font-size:20px;margin-bottom:2px}
#about-panel .about-ver{font-size:11px;color:var(--dim);margin-bottom:4px}
#about-panel .about-sub{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.about-link{
  display:block;width:100%;background:none;
  border:none;border-bottom:1px solid var(--stone);
  color:var(--amber);font-family:var(--ui);font-size:12px;letter-spacing:1px;
  text-align:left;padding:7px 0;cursor:pointer;
}
.about-link:hover{color:var(--paper)}
.about-link:last-of-type{border-bottom:none}
#about-close{
  display:block;width:100%;margin-top:14px;
  font-family:var(--ui);font-size:11px;letter-spacing:1px;
  background:var(--panel);color:var(--dim);
  border:2px solid var(--stone);border-radius:4px;padding:6px;cursor:pointer;
}
#about-close:hover{border-color:var(--amber);color:var(--amber)}
/* ---- title & menus ---- */
.center{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 16px 40px;text-align:center}
#bigtitle{
  font-size:56px;font-weight:900;letter-spacing:6px;color:var(--paper);
  text-shadow:4px 4px 0 var(--lantern), 8px 8px 0 #1d1633;
}
.subtitle{font-family:var(--ui);font-size:12px;letter-spacing:4px;color:var(--dim);text-transform:uppercase}
.menubtn{
  width:min(320px,90%);font-family:var(--cjk);font-size:22px;
  background:var(--panel-2);color:var(--paper);
  border:2px solid var(--stone);border-radius:8px;padding:12px;
  cursor:pointer;box-shadow:0 3px 0 #171226;
}
.menubtn small{display:block;font-family:var(--ui);font-size:10px;letter-spacing:2px;color:var(--dim);margin-top:4px}
.menubtn:hover:not(:disabled){border-color:var(--amber)}
.menubtn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.menubtn:disabled{opacity:.4;cursor:not-allowed}
.lvlcard{width:min(320px,90%)}
.lock{color:var(--dim)}
/* combat HP rows */
.hprow{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--ui);font-size:13px;margin-bottom:8px;
  background:var(--panel-2);border:2px solid var(--stone);border-radius:6px;padding:6px 12px}
.hprow .hh{color:var(--blood);letter-spacing:2px}
/* toast */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:2px solid var(--amber);color:var(--amber);
  font-family:var(--ui);font-size:13px;letter-spacing:1px;
  padding:8px 16px;border-radius:6px;opacity:0;transition:all .25s;z-index:60;
}
#toast.show{opacity:1;transform:translateX(-50%)}
.footer{padding:8px 12px;font-family:var(--ui);font-size:10px;color:#5d5480;
  letter-spacing:1px;text-align:center}
@media (prefers-reduced-motion: reduce){
  .bubble{animation:none}
}
@media (max-width:700px){
  /* two-row HUD: level, hearts, SAVE, HOME / items, tooltip size */
  #hud.inlevel #hudtitle{display:none}
  #hud .hudbreak{display:block;flex-basis:100%;order:1}
  #hud #hudinv{order:2;flex:1}
  #hud .tipsize-group{order:3;margin-left:auto}
}
@media (max-width:520px){
  /* tighter spacing so row 1 fits at 360px with 10 hearts */
  body{padding-left:6px;padding-right:6px}
  #hud{gap:6px;padding:8px}
  #hud .tag,.hudbtn{letter-spacing:0}
  #hearts{letter-spacing:0}
  .hudbtn{padding:4px 7px}
  .bubble{font-size:20px;padding-right:70px}
  .choice{font-size:19px}
  #bigtitle{font-size:40px}
}
</style>
</head>
<body>
<div id="frame">
  <div id="cart">
    <div id="hud">
      <span id="hudtitle" class="tag">HANZI·QUEST</span>

      <span id="hudinv"></span>
      <span id="hearts"></span>
      <span class="grow"></span>
      <span class="hudbreak"></span>
      <span class="tipsize-group" title="Tooltip font size">
        <button class="hudbtn" id="tsS">S</button>
        <button class="hudbtn" id="tsM">M</button>
        <button class="hudbtn" id="tsL">L</button>

      <button class="hudbtn" id="btnSave" title="Save progress">存 SAVE</button>
      <button class="hudbtn" id="btnHome" title="Back to title">主页 HOME</button>

      <div id="lvlbadge"></div>

</div>
<div id="tip"><div class="th"></div><div class="tp"></div><div class="te"></div></div>
<div id="toast"></div>
<div id="about-backdrop">
  <div id="about-panel">
    <div class="about-title">汉字冒险 · Hanzi Quest</div>
    <div class="about-ver" id="about-ver"></div>
    <div class="about-sub">8-bit Mandarin adventure</div>
    <button class="about-link" data-url="https://github.com/CalebA42/hanzi-quest-app">⌂ GitHub Repository →</button>
    <button class="about-link" data-url="https://github.com/CalebA42/hanzi-quest-app/releases">↓ Download for Offline Play →</button>

    <button id="about-close">CLOSE</button>
  </div>
</div>

/* Build a token line from "word|word|！" — words not in D render as punctuation. */

  return s.split("|").map(h=>{

          L("山洞|里|的|猫|、|森林|里|的|老人|、|小城|里|的|男人|、|海上|的|船长|、|雪山|上|的|雪怪|……")],

<script>
/* ============================================================
   ENGINE — state, save/load, rendering, combat
   ============================================================ */
const $ = s=>document.querySelector(s);
const stage=$("#stage"), hud=$("#hud"), hudlvl=$("#hudlvl"), hudinv=$("#hudinv"), heartsEl=$("#hearts"),
      badge=$("#lvlbadge"), tip=$("#tip"), toast=$("#toast");

let S = null;            // game state (null = on title screen)
let unlocked = [1];      // unlocked levels
let memStore = {};       // fallback if localStorage is blocked

function store(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }catch(e){ return null; } }
function persist(key,val){ const st=store(); if(st) st.setItem(key,val); else memStore[key]=val; return !!st; }
function recall(key){ const st=store(); return st ? st.getItem(key) : (memStore[key]??null); }
function wipe(){ const st=store(); if(st){st.removeItem("hq_save");st.removeItem("hq_unlocked");} memStore={}; }

const TIP_SIZES={S:[13,12],M:[16,14],L:[20,17]};
function setTipSize(k){
  const [py,en]=TIP_SIZES[k]||TIP_SIZES.M;
  document.documentElement.style.setProperty("--tip-py-size",py+"px");
  document.documentElement.style.setProperty("--tip-en-size",en+"px");
  persist("hq_tip_size",k);
  ["S","M","L"].forEach(s=>$("#ts"+s).classList.toggle("on",s===k));
}

const APP_VERSION = "1.2.1";
function openLink(url){
  if(window.hanziBridge) window.hanziBridge.openExternal(url);
  else window.open(url,"_blank","noopener,noreferrer");
}
function showAbout(){
  $("#about-ver").textContent="v"+(window.hanziBridge?.version??APP_VERSION);
  $("#about-backdrop").classList.add("open");
}
function hideAbout(){ $("#about-backdrop").classList.remove("open"); }

function showToast(msg){ toast.textContent=msg; toast.classList.add("show");
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>toast.classList.remove("show"),1600); }

function loadUnlocked(){ try{ const u=JSON.parse(recall("hq_unlocked")); if(Array.isArray(u)&&u.length) unlocked=u; }catch(e){} }
function saveUnlocked(){ persist("hq_unlocked",JSON.stringify(unlocked)); }

function saveGame(silent){
  if(!S){ showToast("没有游戏 · nothing to save"); return; }
  const ok = persist("hq_save",JSON.stringify(S));
  if(!silent) showToast(ok?"已保存 · saved!":"已保存（仅本次）· saved (this session only)");
}
function loadGame(){ try{ const s=JSON.parse(recall("hq_save")); return (s&&LEVELS[s.level]&&LEVELS[s.level].nodes[s.node])?s:null; }catch(e){ return null; } }

/* ---------------- tooltip ---------------- */
function tipShow(el,tok){
  tip.querySelector(".th").textContent=tok.h;
  tip.querySelector(".tp").textContent=tok.p;
  tip.querySelector(".te").textContent=tok.e;
  tip.style.display="block";
  const r=el.getBoundingClientRect(), tw=tip.offsetWidth;
  let x=r.left+r.width/2-tw/2;
  x=Math.max(8,Math.min(x,innerWidth-tw-8));
  let y=r.top-tip.offsetHeight-8;
  if(y<8) y=r.bottom+8;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function tipHide(){ tip.style.display="none"; }

/* ---------------- word / line rendering ---------------- */
function renderLine(line,{tipOnClick=true}={}){
  const span=document.createElement("span");
  line.forEach(tok=>{
    if(tok.punct){
      const p=document.createElement("span");
      p.className="punct"; p.textContent=tok.h; span.appendChild(p); return;
    }
    const w=document.createElement("span"); w.className="w";
    const ruby=document.createElement("ruby");
    ruby.appendChild(document.createTextNode(tok.h));
    const rt=document.createElement("rt"); rt.textContent=tok.p; ruby.appendChild(rt);
    w.appendChild(ruby);
    w.addEventListener("mouseenter",()=>tipShow(w,tok));
    w.addEventListener("mouseleave",tipHide);
    if(tipOnClick) w.addEventListener("click",e=>{e.stopPropagation(); tipShow(w,tok);});
    span.appendChild(w);
  });
  return span;
}
function makeBubble(lines,chip){
  const b=document.createElement("div"); b.className="bubble";
  if(chip){ const c=document.createElement("span"); c.className="chip"; c.textContent=chip; b.appendChild(c); }
  lines.forEach((line,i)=>{
    b.appendChild(renderLine(line));
    if(i<lines.length-1) b.appendChild(document.createElement("br"));
  });
  const helpers=document.createElement("div"); helpers.className="helpers";
  const py=document.createElement("button"); py.className="mini"; py.textContent="拼";
  py.title="Toggle pinyin";
  py.onclick=()=>{ b.classList.toggle("show-py"); py.classList.toggle("on"); };
  helpers.append(py); b.appendChild(helpers);
  return b;
}
function makeChoice(ch,onPick){
  const btn=document.createElement("button");
  btn.className="choice"+(ch.danger?" danger":"");
  btn.appendChild(renderLine(ch.t,{tipOnClick:false}));
  const helpers=document.createElement("div"); helpers.className="helpers";
  const py=document.createElement("button"); py.className="mini"; py.textContent="拼";
  py.onclick=e=>{e.stopPropagation(); btn.classList.toggle("show-py"); py.classList.toggle("on");};
  helpers.append(py); btn.appendChild(helpers);
  btn.style.paddingRight="44px";
  btn.addEventListener("click",()=>{tipHide(); onPick(ch);});
  return btn;
}

/* ---------------- HUD ---------------- */
function drawHUD(){
  hud.classList.toggle("inlevel",!!S);
  hud.classList.toggle("hasitems",!!(S&&S.items.length));
  if(!S){ hudlvl.textContent=""; hudinv.textContent=""; heartsEl.textContent=""; badge.textContent=""; return; }
  const lv=LEVELS[S.level];
  hudlvl.textContent=`LV${S.level} · HSK${lv.hsk}`;
  heartsEl.textContent="♥".repeat(S.hp)+"·".repeat(Math.max(0,lv.maxhp-S.hp));
  badge.textContent=`第${["一","二","三","四","五","六"][S.level-1]}关 · ${lv.name}`;
  hudinv.replaceChildren(...S.items.map(itemChip));
}

function itemChip(h){
  const [p,e]=D[h]||["",""], tok={h,p,e};
  const c=document.createElement("span"); c.className="item"; c.textContent=h;
  c.addEventListener("mouseenter",()=>tipShow(c,tok));
  c.addEventListener("mouseleave",tipHide);
  c.addEventListener("click",ev=>{ev.stopPropagation(); tipShow(c,tok);});
  return c;
}

/* ---------------- scenes ---------------- */
function goNode(id){
  if(id==="@title") return showTitle();
  if(id==="@restart"){ startLevel(S.level); return; }
  if(id.startsWith("@level:")){ startLevel(parseInt(id.slice(7),10)); return; }
  S.node=id;
  const lv=LEVELS[S.level], node=lv.nodes[id];
  if(node.combat) return enterCombat(node);
  if(node.victory && !unlocked.includes(S.level+1) && LEVELS[S.level+1]){
    unlocked.push(S.level+1); saveUnlocked(); saveGame(true);
    showToast("第"+["一","二","三","四","五","六"][S.level]+"关 unlocked! (auto-saved)");
  }
  setScene(node.bg,node.sprite);
  stage.innerHTML="";
  stage.appendChild(makeBubble(node.text,node.chip));
  const box=document.createElement("div"); box.id="choices";
  node.choices.forEach(ch=>box.appendChild(makeChoice(ch,pick)));
  stage.appendChild(box);
  drawHUD();
}
function pick(ch){
  if(ch.req && !S.items.includes(ch.req)) return goNode(ch.missing);
  if(ch.give && !S.items.includes(ch.give)) S.items.push(ch.give);
  if(ch.heal) S.hp=Math.min(LEVELS[S.level].maxhp,S.hp+ch.heal);
  goNode(ch.next);
}

/* ---------------- combat ---------------- */
let C=null; // combat state
function enterCombat(node){
  C={node,ehp:node.combat.hp,busy:false};
  const keep=(scene.bg && scene.bg!=="title") ? scene.bg : "battle";
  setScene(keep,node.combat.sprite);
  renderCombat([]);
}
function heartsStr(n,max){ return "♥".repeat(Math.max(0,n))+"·".repeat(Math.max(0,max-n)); }
function renderCombat(log){
  const cb=C.node.combat, lv=LEVELS[S.level];
  stage.innerHTML="";
  const row1=document.createElement("div"); row1.className="hprow";
  row1.innerHTML=""; const nm=document.createElement("span");
  nm.appendChild(renderLine(cb.name)); nm.style.fontFamily="var(--cjk)"; nm.style.fontSize="18px";
  const hh=document.createElement("span"); hh.className="hh"; hh.textContent=heartsStr(C.ehp,cb.hp);
  row1.append(nm,hh); stage.appendChild(row1);
  const row2=document.createElement("div"); row2.className="hprow";
  row2.innerHTML=`<span>你 YOU</span><span class="hh">${heartsStr(S.hp,lv.maxhp)}</span>`;
  stage.appendChild(row2);
  log.forEach(entry=>stage.appendChild(makeBubble([entry.line])));
  if(C.ehp<=0){ finishCombat("win"); return; }
  if(S.hp<=0){ finishCombat("lose"); return; }
  const box=document.createElement("div"); box.id="choices";
  box.appendChild(makeChoice({t:CT.attack,danger:true},()=>turn("attack")));
  box.appendChild(makeChoice({t:CT.rest},()=>turn("rest")));
  box.appendChild(makeChoice({t:CT.flee},()=>turn("flee")));
  stage.appendChild(box);
  drawHUD();
}
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function turn(action){
  if(C.busy) return; C.busy=true;
  const cb=C.node.combat, lv=LEVELS[S.level], log=[];
  /* the hero grows: stronger hits and better rests at higher HSK levels */
  const pAtk = ()=>rnd(2,3)+Math.floor((S.level-1)/3);
  const pRest = 1+Math.floor(S.level/2);
  if(action==="attack"){ C.ehp-=pAtk(); log.push({line:CT.youHit}); fx.hitEnemy(); }
  if(action==="rest"){ S.hp=Math.min(lv.maxhp,S.hp+pRest); log.push({line:CT.youRest}); }
  if(action==="flee"){ const target=C.node.flee; log.push({line:CT.youRan});
    renderCombat(log);
    setTimeout(()=>{C=null; goNode(target);},700); return; }
  if(C.ehp>0){
    S.hp-=rnd(cb.atk[0],cb.atk[1]); log.push({line:CT.itHit}); fx.hitPlayer();
  } else log.push({line:CT.itRan});
  renderCombat(log); C.busy=false;
}
function C0targ(kind){ return C.node[kind]; }
function finishCombat(result){
  const target=C.node[result]; C=null;
  setTimeout(()=>goNode(target),650);
  drawHUD();
}

/* ---------------- title & menus ---------------- */
function menuBtn(zh,en,fn,disabled){
  const b=document.createElement("button"); b.className="menubtn";
  b.innerHTML=zh+"<small>"+en+"</small>"; b.disabled=!!disabled;
  if(fn) b.onclick=fn; return b;
}
function showTitle(){
  S=null; C=null; drawHUD(); setScene("title","torch");
  stage.innerHTML="";
  const c=document.createElement("div"); c.className="center";
  const t=document.createElement("div"); t.id="bigtitle"; t.textContent="汉字冒险";
  const st=document.createElement("div"); st.className="subtitle"; st.textContent="HANZI QUEST · 8-BIT MANDARIN";
  c.append(t,st);
  const save=loadGame();
  c.appendChild(menuBtn("开始","NEW GAME — pick a level",showLevels));
  c.appendChild(menuBtn("继续", save?("CONTINUE — LV"+save.level+" · "+LEVELS[save.level].name):"CONTINUE — no save found",
    ()=>{ const s=loadGame(); if(s){S=s; goNode(S.node);} }, !save));
  c.appendChild(menuBtn("重置","RESET — erase save + unlocks",()=>{
    if(confirm("Reset everything? 重置所有进度？")){ wipe(); unlocked=[1]; showToast("已重置 · reset done"); showTitle(); }
  }));
  c.appendChild(menuBtn("关于","ABOUT — version & links",showAbout));
  stage.appendChild(c);
}
function showLevels(){
  setScene("title","torch"); stage.innerHTML="";
  const c=document.createElement("div"); c.className="center";
  const st=document.createElement("div"); st.className="subtitle"; st.textContent="SELECT LEVEL · 选关";
  c.appendChild(st);
  [[1,"第一关 · 山洞","HSK 1 · THE CAVE"],
   [2,"第二关 · 森林","HSK 2 · THE FOREST"],
   [3,"第三关 · 小城","HSK 3 · THE TOWN"],
   [4,"第四关 · 小岛","HSK 4 · THE ISLAND"],
   [5,"第五关 · 雪山","HSK 5 · SNOW MOUNTAIN"],
   [6,"第六关 · 古庙","HSK 6 · THE ANCIENT TEMPLE"]].forEach(([n,zh,en])=>{
    const exists=!!LEVELS[n];
    const locked = !exists || !unlocked.includes(n);
    const sub = !exists ? "IN THE WORKSHOP"
              : locked ? ("FINISH LV"+(n-1)+" TO UNLOCK") : en;
    const b=menuBtn(locked?("🔒 "+zh):zh, sub,
      locked?null:()=>startLevel(n), locked);
    b.classList.add("lvlcard"); c.appendChild(b);
  });
  c.appendChild(menuBtn("回主页","BACK TO TITLE",showTitle));
  stage.appendChild(c);
}
function startLevel(n){
  const lv=LEVELS[n];
  S={level:n,node:lv.start,hp:lv.maxhp,items:[]};
  goNode(lv.start);
}

/* HUD buttons */
$("#btnSave").onclick=()=>saveGame(false);
$("#btnHome").onclick=()=>{ if(!S || confirm("Back to title? Unsaved progress is lost.\n回主页？")) showTitle(); };
["S","M","L"].forEach(s=>$("#ts"+s).onclick=()=>setTipSize(s));
setTipSize(recall("hq_tip_size")||"M");
document.querySelectorAll(".about-link[data-url]").forEach(btn=>btn.onclick=()=>openLink(btn.dataset.url));
$("#about-backdrop").addEventListener("click",e=>{ if(e.target===$("#about-backdrop")) hideAbout(); });
$("#about-close").onclick=hideAbout;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideAbout(); });
document.addEventListener("scroll",tipHide,true);
</script>

  }
}
/* deterministic pseudo-random for stable scenery */
function h2(i,j){ const n=Math.sin(i*127.1+j*311.7)*43758.5453; return n-Math.floor(n); }

let scene={bg:"title",sprite:"torch"}, T=0;
let shake=0, flash=null;
const fx={
  hitEnemy(){ shake=8; flash="rgba(255,255,255,.25)"; },
  hitPlayer(){ shake=8; flash="rgba(224,86,107,.3)"; }
};
function setScene(bg,sprite){ scene={bg,sprite}; }

function bgCave(dk){
  cx.fillStyle=dk?"#0d0a17":"#1c1730"; cx.fillRect(0,0,320,150);
  cx.fillStyle=dk?"#141021":"#262040";
  for(let i=0;i<20;i++)for(let j=0;j<6;j++)
    if(h2(i,j)>.5) cx.fillRect(i*16+((j%2)*8),j*10,14,8);      /* brick wall */
  cx.fillStyle=dk?"#171226":"#2e2749"; cx.fillRect(0,110,320,40); /* floor */
  for(let i=0;i<10;i++) if(h2(i,9)>.6){ cx.fillStyle="#3a3154"; cx.fillRect(i*34+6,118+((i%3)*8),10,4); }
}
function torchAt(x,y){
  drawSprite("torch",x,y,2);
  const fl=reduceMotion?0.5:(0.5+0.18*Math.sin(T/38)+0.07*h2(T>>5,x));
  const g=cx.createRadialGradient(x+15,y+8,4,x+15,y+8,55);
  g.addColorStop(0,`rgba(255,179,71,${0.30*fl+0.15})`);
  g.addColorStop(1,"rgba(255,179,71,0)");
  cx.fillStyle=g; cx.fillRect(x-45,y-45,120,120);
}
function bgForest(){
  cx.fillStyle="#0d1120"; cx.fillRect(0,0,320,150);
  cx.fillStyle="#f2e9d8";
  for(let i=0;i<26;i++) cx.fillRect(Math.floor(h2(i,1)*320),Math.floor(h2(i,2)*70),1,1); /* stars */
  for(let i=0;i<9;i++){ const x=i*38+((i%2)*10);
    cx.fillStyle="#16241c"; cx.fillRect(x+10,30+(i%3)*6,10,90);
    cx.fillStyle="#1e3527"; cx.fillRect(x,20+(i%3)*6,30,50); }
  cx.fillStyle="#152218"; cx.fillRect(0,118,320,32);
}
function bgRiver(){
  bgForest();
  cx.fillStyle="#274a66"; cx.fillRect(0,112,320,38);
  cx.fillStyle="#3f6f94";
  for(let i=0;i<14;i++){ const off=reduceMotion?0:Math.floor(T/6);
    cx.fillRect(((i*29+off)%330)-5,118+(i%4)*8,14,2); }
}
function bgCamp(){
  cx.fillStyle="#131022"; cx.fillRect(0,0,320,150);

    cx.fillStyle="#1a2a1f"; cx.fillRect(x+2,20,28,40); }
  cx.fillStyle="#1d1830"; cx.fillRect(0,106,320,44);
  /* campfire */
  cx.fillStyle="#5c4030"; cx.fillRect(140,122,40,6);
  const fl=reduceMotion?0.6:(0.5+0.25*Math.sin(T/26));
  cx.fillStyle="#e8913c"; cx.fillRect(150,110-fl*6,20,14+fl*6);
  cx.fillStyle="#ffd75e"; cx.fillRect(155,116-fl*4,10,10+fl*4);
  const g=cx.createRadialGradient(160,118,6,160,118,70);
  g.addColorStop(0,`rgba(255,179,71,${0.25+0.15*fl})`); g.addColorStop(1,"rgba(255,179,71,0)");
  cx.fillStyle=g; cx.fillRect(90,48,140,120);
}

  cx.fillStyle="#7ec8e8"; cx.fillRect(0,0,320,150);

  cx.beginPath(); cx.moveTo(110,120); cx.lineTo(200,40); cx.lineTo(290,120); cx.fill();

  cx.fillStyle="#3f7a44"; cx.fillRect(0,118,320,32);
  cx.fillStyle="#7ee08a"; for(let i=0;i<20;i++) cx.fillRect(i*17+4,120+(i%3)*6,3,3);
}

  cx.fillStyle="#7ec8e8"; cx.fillRect(231,33,48,38);        /* morning sky */

function bgTown(){
  cx.fillStyle="#7ec8e8"; cx.fillRect(0,0,320,150);         /* day sky */
  const cols=["#4a3f6b","#5c5c70","#3a3154","#4a3f6b","#5c5c70"];
  for(let i=0;i<5;i++){ const x=i*66-10, h=60+Math.floor(h2(i,3)*36);
    cx.fillStyle=cols[i]; cx.fillRect(x,116-h,58,h);
    cx.fillStyle="#ffd75e";
    for(let r=0;r<Math.floor(h/16);r++)for(let c=0;c<3;c++)
      if(h2(i*10+r,c)>.4) cx.fillRect(x+8+c*16,124-h+r*16,7,8);
    cx.fillStyle="#2e2749"; cx.fillRect(x,116-h,58,5); }   /* roof line */
  cx.fillStyle="#2b2344"; cx.fillRect(0,116,320,34);        /* street */
  cx.fillStyle="#4a3f6b"; for(let i=0;i<8;i++) cx.fillRect(i*44+8,132,20,3);
}
function bgPark(){
  cx.fillStyle="#7ec8e8"; cx.fillRect(0,0,320,150);
  cx.fillStyle="#3f7a44"; cx.fillRect(0,108,320,42);        /* grass */
  cx.fillStyle="#7ee08a"; for(let i=0;i<22;i++) cx.fillRect(i*15+3,112+(i%4)*8,3,3);
  for(let i=0;i<5;i++){ const x=i*70+8;
    cx.fillStyle="#6b4f35"; cx.fillRect(x+16,72,8,42);      /* trunks */
    cx.fillStyle="#2e6b38"; cx.fillRect(x+2,44,36,34);
    cx.fillStyle="#3f7a44"; cx.fillRect(x+8,38,24,14); }
}
function bgRoof(){
  cx.fillStyle="#0d1120"; cx.fillRect(0,0,320,150);         /* night */
  cx.fillStyle="#f2e9d8";
  for(let i=0;i<30;i++) cx.fillRect(Math.floor(h2(i,5)*320),Math.floor(h2(i,6)*80),1,1);
  cx.fillStyle="#f2e9d8"; cx.fillRect(248,20,30,30);        /* moon */
  cx.fillStyle="#c9c2d8"; cx.fillRect(254,26,8,8); cx.fillRect(266,38,6,6);
  cx.fillStyle="#1d1830";                                   /* far rooftops */
  for(let i=0;i<7;i++) cx.fillRect(i*48-6,92+((i%3)*8),44,60);
  cx.fillStyle="#2b2344"; cx.fillRect(0,118,320,32);        /* this rooftop */
  cx.fillStyle="#3a3154"; cx.fillRect(0,118,320,5);
}
function bgHarbor(){
  cx.fillStyle="#7ec8e8"; cx.fillRect(0,0,320,150);          /* sky */
  cx.fillStyle="#274a66"; cx.fillRect(0,84,320,40);          /* sea */
  cx.fillStyle="#3f6f94";
  for(let i=0;i<12;i++){ const off=reduceMotion?0:Math.floor(T/7);
    cx.fillRect(((i*31+off)%330)-5,90+(i%3)*10,16,2); }
  cx.fillStyle="#6b4f35"; cx.fillRect(0,118,320,32);         /* dock */
  cx.fillStyle="#5c4030"; for(let i=0;i<11;i++) cx.fillRect(i*30,118,26,32);
  cx.fillStyle="#5c4030"; cx.fillRect(236,58,50,30);         /* hull */
  cx.fillStyle="#6b4f35"; cx.fillRect(258,20,4,42);          /* mast */
  cx.fillStyle="#f2e9d8"; cx.fillRect(262,24,22,26);         /* sail */
}
function bgSea(){
  cx.fillStyle="#5c7a94"; cx.fillRect(0,0,320,150);          /* stormy sky */
  cx.fillStyle="#8a8a9e";
  for(let i=0;i<5;i++) cx.fillRect(20+i*62,18+(i%2)*14,44,10); /* clouds */
  cx.fillStyle="#1d3a52"; cx.fillRect(0,92,320,58);          /* deep sea */
  cx.fillStyle="#2e5a7a";
  for(let i=0;i<16;i++){ const off=reduceMotion?0:Math.floor(T/5);
    cx.fillRect(((i*27+off)%336)-8,98+(i%5)*10,18,3); }
  const rock=reduceMotion?0:Math.round(Math.sin(T/16)*3);   /* boat rocks */
  cx.fillStyle="#5c4030"; cx.fillRect(126,72+rock,68,24);
  cx.fillStyle="#6b4f35"; cx.fillRect(156,34+rock,4,40);
  cx.fillStyle="#f2e9d8"; cx.fillRect(160,38+rock,26,28);
}
function bgBeach(){
  cx.fillStyle="#7ec8e8"; cx.fillRect(0,0,320,150);
  cx.fillStyle="#274a66"; cx.fillRect(0,78,320,26);          /* sea strip */
  cx.fillStyle="#e8d8a0"; cx.fillRect(0,104,320,46);         /* sand */
  cx.fillStyle="#c9b978"; for(let i=0;i<16;i++) cx.fillRect(i*21+4,112+(i%4)*8,4,2);
  cx.fillStyle="#5c5c70"; cx.fillRect(214,34,106,70);        /* cliff */
  cx.fillStyle="#171226"; cx.fillRect(248,62,40,42);         /* cave mouth */
}
function bgVillage(){
  cx.fillStyle="#aebfd8"; cx.fillRect(0,0,320,150);          /* winter sky */
  cx.fillStyle="#e8ecf4"; cx.fillRect(0,104,320,46);         /* snow ground */
  for(let i=0;i<3;i++){ const x=i*104+16;
    cx.fillStyle="#5c4030"; cx.fillRect(x,72,64,34);         /* houses */
    cx.fillStyle="#3d2b1f"; cx.fillRect(x+24,84,16,22);
    cx.fillStyle="#ffd75e"; cx.fillRect(x+8,80,10,10);
    cx.fillStyle="#e8ecf4"; cx.fillRect(x-4,62,72,12); }     /* snowy roofs */
  cx.fillStyle="#f2e9d8";                                    /* falling snow */
  for(let i=0;i<24;i++){ const off=reduceMotion?0:Math.floor(T/3);
    cx.fillRect(Math.floor(h2(i,7)*320),((Math.floor(h2(i,8)*150)+off)%150),2,2); }
}
function bgSnowmtn(){
  cx.fillStyle="#8fa5c4"; cx.fillRect(0,0,320,150);
  cx.fillStyle="#e8ecf4";                                    /* slope */
  cx.beginPath(); cx.moveTo(0,150); cx.lineTo(320,150); cx.lineTo(320,96); cx.lineTo(0,132); cx.fill();
  cx.fillStyle="#c9d4e8";
  cx.beginPath(); cx.moveTo(180,96); cx.lineTo(320,26); cx.lineTo(320,96); cx.fill();
  cx.fillStyle="#f2e9d8";                                    /* blowing snow */
  for(let i=0;i<26;i++){ const off=reduceMotion?0:Math.floor(T/2);
    cx.fillRect(((Math.floor(h2(i,9)*320)-off)%320+320)%320,Math.floor(h2(i,4)*120),4,1); }
}
function bgSnowcave(){
  cx.fillStyle="#1a2438"; cx.fillRect(0,0,320,150);
  cx.fillStyle="#243452";
  for(let i=0;i<20;i++)for(let j=0;j<6;j++)
    if(h2(i+40,j)>.5) cx.fillRect(i*16+((j%2)*8),j*10,14,8);
  cx.fillStyle="#7ec8e8";                                    /* icicles */
  for(let i=0;i<9;i++) cx.fillRect(i*36+10,0,5,10+Math.floor(h2(i,11)*16));
  cx.fillStyle="#2e405c"; cx.fillRect(0,112,320,38);         /* ice floor */
  cx.fillStyle="#7ec8e8"; for(let i=0;i<8;i++) cx.fillRect(i*42+8,120+(i%3)*8,12,2);
}
function bgTemple(){
  cx.fillStyle="#c47a5c"; cx.fillRect(0,0,320,60);           /* dusk sky */
  cx.fillStyle="#8fa5c4"; cx.fillRect(0,60,320,40);          /* clouds below peak */
  cx.fillStyle="#5c5c70"; cx.fillRect(0,96,320,54);          /* stone summit */
  cx.fillStyle="#4a3f6b"; for(let i=0;i<5;i++) cx.fillRect(0,100+i*10,320,3); /* steps */
  cx.fillStyle="#8a3838"; cx.fillRect(36,34,14,66); cx.fillRect(270,34,14,66); /* pillars */
  cx.fillStyle="#d94f4f"; cx.fillRect(36,34,14,6); cx.fillRect(270,34,14,6);
  cx.fillStyle="#3a2b20"; cx.fillRect(20,22,280,14);         /* roof beam */
  cx.fillStyle="#8a3838"; cx.fillRect(10,16,300,8);
}
function bgShrine(){
  cx.fillStyle="#1d1526"; cx.fillRect(0,0,320,150);
  cx.fillStyle="#2b1f33";
  for(let i=0;i<20;i++)for(let j=0;j<6;j++)
    if(h2(i+80,j)>.5) cx.fillRect(i*16+((j%2)*8),j*10,14,8);
  cx.fillStyle="#241b2e"; cx.fillRect(0,112,320,38);
  cx.fillStyle="#c9c2d8"; cx.fillRect(128,34,64,74);         /* mirror */
  cx.fillStyle="#e8ecf4"; cx.fillRect(134,40,52,62);
  cx.fillStyle="#c9a227"; cx.strokeStyle="#c9a227";
  cx.strokeRect(127.5,33.5,65,75);
  cx.fillStyle="#5c5c70"; cx.fillRect(36,72,40,40);          /* stone tablet */
  cx.fillStyle="#3a3154"; for(let i=0;i<4;i++) cx.fillRect(44,78+i*8,24,3);
  const fl=reduceMotion?0.5:(0.5+0.25*Math.sin(T/30));       /* candles */
  cx.fillStyle="#f2e9d8"; cx.fillRect(246,92,6,16); cx.fillRect(266,96,6,12);
  cx.fillStyle=`rgba(255,179,71,${0.6+0.3*fl})`;
  cx.fillRect(247,86-fl*3,4,7); cx.fillRect(267,90-fl*3,4,7);
}
function drawDoors(){
  cx.fillStyle="#5c4030"; cx.fillRect(50,52,52,62);   /* big door */
  cx.fillStyle="#3d2b1f"; cx.fillRect(56,58,40,56);
  cx.fillStyle="#ffd75e"; cx.fillRect(88,86,4,6);
  cx.fillStyle="#5c4030"; cx.fillRect(226,76,34,38);  /* small door */
  cx.fillStyle="#3d2b1f"; cx.fillRect(230,80,26,34);
  cx.fillStyle="#ffd75e"; cx.fillRect(250,94,3,5);
  cx.fillStyle="#5c4030"; cx.fillRect(140,62,44,52);  /* middle door, hot */
  const fl=reduceMotion?0.5:(0.5+0.3*Math.sin(T/26));
  cx.fillStyle=`rgba(224,86,107,${0.5+0.3*fl})`; cx.fillRect(145,67,34,47);
  cx.fillStyle=`rgba(255,179,71,${0.4+0.3*fl})`; cx.fillRect(151,74,22,40);
}
function drawBackdoor(){
  cx.fillStyle="#2b2344"; cx.fillRect(132,56,58,58);
  cx.fillStyle="#171226"; cx.fillRect(138,62,46,52);
  cx.fillStyle="#ffd75e"; cx.fillRect(176,86,4,7);
  cx.strokeStyle="#4a3f6b"; cx.strokeRect(132.5,56.5,57,57);
}
function loop(){
  T++;
  const sx = shake>0 ? (Math.random()*shake-shake/2) : 0;
  if(shake>0) shake-=1;
  cx.save(); cx.translate(sx,0);
  const b=scene.bg;
  if(b==="cave"){ bgCave(false); torchAt(18,44); torchAt(282,44); }
  else if(b==="dark"){ bgCave(true); torchAt(150,40); }
  else if(b==="battle"){ bgCave(true); torchAt(18,44); torchAt(282,44); }
  else if(b==="forest") bgForest();
  else if(b==="river") bgRiver();
  else if(b==="camp") bgCamp();
  else if(b==="home") bgHome();
  else if(b==="town") bgTown();
  else if(b==="park") bgPark();
  else if(b==="roof") bgRoof();
  else if(b==="harbor") bgHarbor();
  else if(b==="sea") bgSea();
  else if(b==="beach") bgBeach();
  else if(b==="village") bgVillage();
  else if(b==="snowmtn") bgSnowmtn();
  else if(b==="snowcave") bgSnowcave();
  else if(b==="temple") bgTemple();
  else if(b==="shrine") bgShrine();
  else if(b==="exit"){ bgCave(true);
    const g=cx.createRadialGradient(160,80,10,160,80,120);
    g.addColorStop(0,"rgba(255,215,94,.5)"); g.addColorStop(1,"rgba(255,215,94,0)");
    cx.fillStyle=g; cx.fillRect(0,0,320,150); }
  else if(b==="outside") bgOutside();
  else { /* title */ bgCave(false); torchAt(60,50); torchAt(230,50); }
  /* sprite */
  const s=scene.sprite;
  if(s==="doors") drawDoors();
  else if(s==="backdoor") drawBackdoor();
  else if(s==="firedoor"){ drawDoors(); }
  else if(s==="torch"){ /* title torches already drawn */ }
  else if(s && SPR[s]){
    const bob=reduceMotion?0:Math.round(Math.sin(T/18)*2);
    const scale = C?7:6;
    const w=16*scale;
    drawSprite(s,160-w/2,(C?24:36)+bob,scale);
  }
  cx.restore();
  if(flash){ cx.fillStyle=flash; cx.fillRect(0,0,320,150); flash=null; }
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
loadUnlocked();
loop();
showTitle();
if(!store()){
  const note=document.createElement("div");
  note.className="bubble sys";
  note.textContent="NOTE: this browser view blocks saving. Download the file and open it locally (double-click) and 存 SAVE will persist.";
  stage.prepend(note);
}
